# fly.toml app configuration file generated for livensa-ad-tool on 2026-10-24T14:39:12+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'livensa-ad-tool'
primary_region = 'fra'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'data_vol'
  destination = '/app/data'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

